<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 / 注册 - 绿豆蛙日报助手</title>
    <link rel="icon" href="/favicon.jpg" type="image/jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f3f7f2;
            --ink: #16301f;
            --ink-soft: #4a6253;
            --ink-faint: #8aa093;
            --green: #2f9e44;
            --green-deep: #1f6f31;
            --green-dark: #122b1c;
            --green-mid: #1c4229;
            --lime: #a9e34b;
            --paper: #ffffff;
            --line: #dde8dc;
            --danger: #e03131;
            --font-display: 'Noto Serif SC', serif;
            --font-body: 'Noto Sans SC', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        }

        html, body { height: 100%; }
        body {
            font-family: var(--font-body);
            color: var(--ink);
            background: var(--bg);
            overflow: hidden;
        }
        input, button { font-family: inherit; border: none; outline: none; background: none; }
        a { text-decoration: none; }

        /* ============ 返回首页 ============ */
        .back-link {
            position: fixed; top: 26px; left: 28px; z-index: 60;
            display: inline-flex; align-items: center; gap: 9px;
            color: rgba(255,255,255,0.75); font-size: 0.88rem; font-weight: 500;
            padding: 9px 18px 9px 14px; border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06);
            backdrop-filter: blur(8px); transition: all 0.3s var(--ease);
        }
        .back-link i { font-size: 0.8rem; transition: transform 0.3s var(--ease); }
        .back-link:hover { color: #fff; background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.35); }
        .back-link:hover i { transform: translateX(-4px); }

        /* ============ 场景布局 ============ */
        .scene { display: grid; grid-template-columns: 46% 54%; height: 100vh; }

        /* ============ 左侧品牌面板 ============ */
        .brand-panel {
            position: relative; overflow: hidden;
            background: linear-gradient(160deg, var(--green-dark) 0%, var(--green-mid) 55%, #235c36 100%);
            display: flex; align-items: center; justify-content: center;
            padding: 70px 56px;
        }
        /* 网格底纹 */
        .brand-grid {
            position: absolute; inset: 0; opacity: 0.5;
            background-image:
                linear-gradient(rgba(169,227,75,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(169,227,75,0.05) 1px, transparent 1px);
            background-size: 52px 52px;
            mask-image: radial-gradient(ellipse 90% 80% at 40% 40%, #000 20%, transparent 80%);
        }
        /* 漂浮光斑 */
        .orb { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.55; animation: orbDrift 14s ease-in-out infinite; }
        .orb-a { width: 380px; height: 380px; background: rgba(47,158,68,0.5); top: -120px; right: -100px; }
        .orb-b { width: 300px; height: 300px; background: rgba(169,227,75,0.28); bottom: -100px; left: -80px; animation-delay: -6s; }
        @keyframes orbDrift { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-30px,36px) scale(1.12); } }

        /* 上升粒子 */
        .particles { position: absolute; inset: 0; overflow: hidden; }
        .particles i {
            position: absolute; bottom: -12px; width: 5px; height: 5px; border-radius: 50%;
            background: rgba(169,227,75,0.55); animation: rise linear infinite;
        }
        @keyframes rise {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            12% { opacity: 0.9; }
            100% { transform: translateY(-105vh) translateX(26px); opacity: 0; }
        }

        .brand-content { position: relative; z-index: 2; max-width: 480px; width: 100%; }

        .brand-logo { display: flex; align-items: center; gap: 14px; margin-bottom: 46px; animation: fadeUp 0.8s var(--ease-out) both; }
        .brand-logo img {
            width: 52px; height: 52px; border-radius: 50%; object-fit: cover;
            box-shadow: 0 0 0 4px rgba(169,227,75,0.22), 0 8px 24px rgba(0,0,0,0.35);
            animation: logoBreath 4s ease-in-out infinite;
        }
        @keyframes logoBreath { 0%,100% { box-shadow: 0 0 0 4px rgba(169,227,75,0.22), 0 8px 24px rgba(0,0,0,0.35);} 50% { box-shadow: 0 0 0 8px rgba(169,227,75,0.12), 0 8px 24px rgba(0,0,0,0.35);} }
        .brand-logo span { font-family: var(--font-display); font-weight: 900; font-size: 1.3rem; color: #fff; }
        .brand-logo span em { font-style: normal; color: var(--lime); }

        .brand-eyebrow {
            display: inline-flex; align-items: center; gap: 9px;
            color: var(--lime); font-family: var(--font-mono); font-size: 0.74rem;
            font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
            margin-bottom: 20px; animation: fadeUp 0.8s var(--ease-out) 0.08s both;
        }
        .brand-eyebrow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); position: relative; }
        .brand-eyebrow .dot::after { content:''; position:absolute; inset:-4px; border-radius:50%; border:2px solid var(--lime); animation:pulse 1.8s ease-out infinite; }
        @keyframes pulse { 0%{transform:scale(.5);opacity:.9} 100%{transform:scale(1.5);opacity:0} }

        .brand-headline {
            font-family: var(--font-display); font-weight: 900; color: #fff;
            font-size: clamp(2rem, 3.4vw, 2.9rem); line-height: 1.3; letter-spacing: -0.01em;
            margin-bottom: 18px; animation: fadeUp 0.8s var(--ease-out) 0.16s both;
        }
        .brand-headline .hl { color: var(--lime); position: relative; white-space: nowrap; }
        .brand-headline .hl::after { content:''; position:absolute; left:-3%; right:-3%; bottom:8%; height:30%; background:rgba(169,227,75,0.22); border-radius:5px; transform:skew(-8deg); z-index:-1; }
        .brand-sub { color: rgba(255,255,255,0.66); font-size: 0.98rem; line-height: 1.8; margin-bottom: 40px; animation: fadeUp 0.8s var(--ease-out) 0.24s both; }

        /* 实时识别模拟卡片 */
        .live-sim {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 18px 18px 14px; backdrop-filter: blur(6px);
            margin-bottom: 40px; animation: fadeUp 0.8s var(--ease-out) 0.32s both;
        }
        .live-sim-head { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
        .live-sim-head .rec { width: 8px; height: 8px; border-radius: 50%; background: #ff6b6b; animation: blink 1.2s step-end infinite; }
        @keyframes blink { 50% { opacity: 0.25; } }
        .live-sim-head span { color: rgba(255,255,255,0.7); font-size: 0.78rem; font-weight: 600; letter-spacing: 0.04em; }
        .live-sim-head .scan-line { margin-left: auto; font-family: var(--font-mono); font-size: 0.68rem; color: var(--lime); }
        .sim-feed { display: flex; flex-direction: column; gap: 9px; min-height: 118px; }
        .sim-card {
            display: flex; align-items: center; gap: 11px;
            background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1);
            border-left: 3px solid var(--sc, var(--green)); border-radius: 10px; padding: 9px 12px;
            animation: simIn 0.5s var(--ease-out);
        }
        @keyframes simIn { from { opacity: 0; transform: translateY(12px);} to { opacity:1; transform: translateY(0);} }
        .sim-card .sc-icon { width: 30px; height: 30px; border-radius: 8px; background: var(--sc, var(--green)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:0.75rem; flex-shrink:0; }
        .sim-card .sc-body { flex: 1; min-width: 0; }
        .sim-card .sc-title { color: #fff; font-size: 0.78rem; font-weight: 700; }
        .sim-card .sc-desc { color: rgba(255,255,255,0.5); font-size: 0.68rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sim-card .sc-time { font-family: var(--font-mono); font-size: 0.64rem; color: rgba(255,255,255,0.45); flex-shrink: 0; }

        .brand-stats { display: flex; gap: 34px; animation: fadeUp 0.8s var(--ease-out) 0.4s both; }
        .brand-stats .bs { }
        .brand-stats strong { display: block; font-family: var(--font-mono); font-size: 1.5rem; font-weight: 700; color: var(--lime); line-height: 1.1; }
        .brand-stats span { font-size: 0.74rem; color: rgba(255,255,255,0.55); }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(26px);} to { opacity: 1; transform: translateY(0);} }

        /* ============ 右侧表单面板 ============ */
        .form-panel {
            position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
            background: var(--bg); padding: 40px;
        }
        .form-panel::before {
            content: ''; position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(47,158,68,0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(47,158,68,0.045) 1px, transparent 1px);
            background-size: 52px 52px;
            mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 20%, transparent 80%);
        }
        .form-glow { position: absolute; width: 460px; height: 460px; border-radius: 50%; filter: blur(90px); opacity: 0.5; pointer-events: none; }
        .form-glow-a { background: rgba(169,227,75,0.2); top: -160px; right: -140px; }
        .form-glow-b { background: rgba(47,158,68,0.14); bottom: -180px; left: -140px; }

        .form-wrap { position: relative; z-index: 2; width: 100%; max-width: 440px; }

        .form-heading { margin-bottom: 30px; animation: fadeUp 0.7s var(--ease-out) 0.1s both; }
        .form-heading h2 { font-family: var(--font-display); font-weight: 900; font-size: 1.9rem; letter-spacing: -0.01em; margin-bottom: 8px; }
        .form-heading p { color: var(--ink-soft); font-size: 0.92rem; }

        /* 分段控制器 */
        .seg {
            position: relative; display: grid; grid-template-columns: 1fr 1fr;
            background: #e7efe6; border: 1px solid var(--line); border-radius: 14px; padding: 5px;
            margin-bottom: 30px; animation: fadeUp 0.7s var(--ease-out) 0.18s both;
        }
        .seg-pill {
            position: absolute; top: 5px; left: 5px; width: calc(50% - 5px); height: calc(100% - 10px);
            background: var(--green-dark); border-radius: 10px;
            box-shadow: 0 4px 14px rgba(18,43,28,0.3);
            transition: transform 0.45s var(--ease-out);
        }
        .seg.signup .seg-pill { transform: translateX(100%); }
        .seg-btn {
            position: relative; z-index: 1; padding: 11px 0; text-align: center;
            font-size: 0.95rem; font-weight: 700; color: var(--ink-soft); cursor: pointer;
            transition: color 0.3s var(--ease); border-radius: 10px;
        }
        .seg-btn.active { color: #fff; }

        /* 表单滑动视窗 */
        .forms-viewport { overflow: hidden; animation: fadeUp 0.7s var(--ease-out) 0.26s both; }
        .forms-track { display: flex; width: 200%; transition: transform 0.55s var(--ease-out); }
        .forms-track.show-signup { transform: translateX(-50%); }
        .form-pane { width: 50%; padding: 4px 2px; }

        .form-card {
            background: var(--paper); border: 1px solid var(--line); border-radius: 20px;
            padding: 34px 32px 30px; box-shadow: 0 18px 50px rgba(22,48,31,0.1);
        }

        /* 输入框组 */
        .field { margin-bottom: 20px; }
        .field-label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--ink-soft); margin-bottom: 8px; letter-spacing: 0.02em; }
        .field-box {
            display: flex; align-items: center; gap: 12px;
            background: #f7faf7; border: 1.5px solid var(--line); border-radius: 12px;
            padding: 0 16px; height: 50px; transition: all 0.3s var(--ease);
        }
        .field-box i.lead { color: var(--ink-faint); font-size: 0.95rem; width: 18px; text-align: center; transition: color 0.3s var(--ease); }
        .field-box input { flex: 1; height: 100%; font-size: 0.95rem; color: var(--ink); background: transparent; min-width: 0; }
        .field-box input::placeholder { color: var(--ink-faint); }
        .field-box:focus-within { border-color: var(--green); background: #fff; box-shadow: 0 0 0 4px rgba(47,158,68,0.13); }
        .field-box:focus-within i.lead { color: var(--green); }
        .field-box.shake { animation: shake 0.45s var(--ease); border-color: var(--danger); }
        @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)} }

        .eye-btn { color: var(--ink-faint); cursor: pointer; font-size: 0.95rem; padding: 6px; transition: color 0.25s var(--ease); }
        .eye-btn:hover { color: var(--green); }

        .forgot-row { display: flex; justify-content: flex-end; margin: -6px 0 16px; }
        .forgot-link {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 0.82rem; font-weight: 600; color: var(--ink-faint);
            transition: color 0.25s var(--ease); position: relative;
        }
        .forgot-link::after { content:''; position:absolute; left:0; right:0; bottom:-3px; height:1.5px; background:var(--green); transform:scaleX(0); transform-origin:right; transition:transform 0.3s var(--ease); }
        .forgot-link:hover { color: var(--green-deep); }
        .forgot-link:hover::after { transform:scaleX(1); transform-origin:left; }

        /* 验证码行 */
        .code-flex { display: flex; gap: 10px; }
        .code-flex .field-box { flex: 1; }
        .code-send {
            flex-shrink: 0; height: 50px; padding: 0 18px; border-radius: 12px; cursor: pointer;
            background: rgba(47,158,68,0.12); color: var(--green-deep); font-size: 0.85rem; font-weight: 700;
            border: 1.5px solid rgba(47,158,68,0.3); transition: all 0.3s var(--ease); white-space: nowrap;
        }
        .code-send:hover:not(:disabled) { background: var(--green); color: #fff; border-color: var(--green); box-shadow: 0 6px 16px rgba(47,158,68,0.3); }
        .code-send:disabled { background: #eef2ee; color: var(--ink-faint); border-color: var(--line); cursor: not-allowed; }

        /* 提交按钮 */
        .submit-btn {
            position: relative; overflow: hidden; width: 100%; height: 52px; margin-top: 6px;
            border-radius: 13px; cursor: pointer;
            background: linear-gradient(135deg, var(--green), var(--green-deep));
            color: #fff; font-size: 1rem; font-weight: 700; letter-spacing: 0.06em;
            box-shadow: 0 10px 26px rgba(47,158,68,0.35);
            transition: all 0.3s var(--ease);
        }
        .submit-btn::before {
            content: ''; position: absolute; top: 0; left: -80%; width: 50%; height: 100%;
            background: linear-gradient(100deg, transparent, rgba(255,255,255,0.32), transparent);
            transform: skewX(-20deg); transition: left 0.6s var(--ease);
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(47,158,68,0.42); }
        .submit-btn:hover::before { left: 130%; }
        .submit-btn:active { transform: translateY(0); }
        .submit-btn:disabled { opacity: 0.75; cursor: wait; transform: none; }
        .submit-btn .spinner { display: none; width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,0.35); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 9px; vertical-align: -4px; }
        .submit-btn.loading .spinner { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 消息 */
        .msg { min-height: 20px; font-size: 0.8rem; text-align: center; margin-top: 14px; transition: all 0.3s var(--ease); }
        .msg.error { color: var(--danger); }
        .msg.success { color: var(--green); font-weight: 600; }

        .form-foot { text-align: center; margin-top: 22px; font-size: 0.82rem; color: var(--ink-faint); animation: fadeUp 0.7s var(--ease-out) 0.34s both; }
        .form-foot a { color: var(--green-deep); font-weight: 600; border-bottom: 1px solid transparent; transition: border-color 0.25s var(--ease); }
        .form-foot a:hover { border-bottom-color: var(--green-deep); }

        /* ============ 找回密码全屏界面 ============ */
        .fp-overlay {
            position: fixed; inset: 0; z-index: 100;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(160deg, var(--green-dark) 0%, var(--green-mid) 55%, #235c36 100%);
            opacity: 0; visibility: hidden;
            transition: opacity 0.45s var(--ease), visibility 0.45s;
        }
        .fp-overlay.open { opacity: 1; visibility: visible; }

        .fp-bg { position: absolute; inset: 0; overflow: hidden; }
        .fp-grid {
            position: absolute; inset: 0; opacity: 0.5;
            background-image:
                linear-gradient(rgba(169,227,75,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(169,227,75,0.05) 1px, transparent 1px);
            background-size: 52px 52px;
            mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 20%, transparent 80%);
        }
        .fp-orb-a { width: 420px; height: 420px; background: rgba(47,158,68,0.5); top: -140px; left: -120px; }
        .fp-orb-b { width: 340px; height: 340px; background: rgba(169,227,75,0.26); bottom: -120px; right: -100px; animation-delay: -7s; }

        .fp-back {
            position: absolute; top: 26px; left: 28px; z-index: 5;
            display: inline-flex; align-items: center; gap: 9px;
            color: rgba(255,255,255,0.75); font-size: 0.88rem; font-weight: 500;
            padding: 9px 18px 9px 14px; border-radius: 999px; cursor: pointer;
            border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06);
            backdrop-filter: blur(8px); transition: all 0.3s var(--ease);
        }
        .fp-back i { font-size: 0.8rem; transition: transform 0.3s var(--ease); }
        .fp-back:hover { color: #fff; background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.35); }
        .fp-back:hover i { transform: translateX(-4px); }

        .fp-wrap { position: relative; z-index: 2; width: 100%; max-width: 460px; padding: 20px; }

        /* 入场编排 */
        .fp-overlay.open .fp-icon   { animation: fpUp 0.6s var(--ease-out) 0.05s both; }
        .fp-overlay.open .fp-title  { animation: fpUp 0.6s var(--ease-out) 0.12s both; }
        .fp-overlay.open .fp-sub    { animation: fpUp 0.6s var(--ease-out) 0.18s both; }
        .fp-overlay.open .fp-steps  { animation: fpUp 0.6s var(--ease-out) 0.24s both; }
        .fp-overlay.open .fp-card   { animation: fpUp 0.6s var(--ease-out) 0.30s both; }
        @keyframes fpUp { from { opacity: 0; transform: translateY(28px);} to { opacity: 1; transform: translateY(0);} }

        .fp-icon {
            position: relative; width: 76px; height: 76px; margin: 0 auto 22px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(169,227,75,0.14); border: 1px solid rgba(169,227,75,0.3);
            border-radius: 22px; color: var(--lime); font-size: 1.7rem;
        }
        .fp-icon i { animation: keyWiggle 3s ease-in-out infinite; }
        @keyframes keyWiggle { 0%,100%{transform:rotate(0)} 8%{transform:rotate(-14deg)} 16%{transform:rotate(10deg)} 24%{transform:rotate(0)} }
        .fp-icon-ring { position: absolute; inset: -8px; border-radius: 28px; border: 1.5px solid rgba(169,227,75,0.35); animation: ringPulse 2.4s ease-out infinite; }
        @keyframes ringPulse { 0%{transform:scale(.85);opacity:.8} 100%{transform:scale(1.25);opacity:0} }

        .fp-title { font-family: var(--font-display); font-weight: 900; font-size: 1.9rem; color: #fff; text-align: center; letter-spacing: -0.01em; margin-bottom: 8px; }
        .fp-sub { color: rgba(255,255,255,0.62); font-size: 0.9rem; text-align: center; margin-bottom: 26px; }

        /* 步骤指示器 */
        .fp-steps { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 24px; }
        .fp-step { display: flex; align-items: center; gap: 9px; }
        .fp-step-dot {
            width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-family: var(--font-mono); font-size: 0.78rem; font-weight: 700;
            color: rgba(255,255,255,0.5); border: 1.5px solid rgba(255,255,255,0.25);
            transition: all 0.4s var(--ease);
        }
        .fp-step-label { font-size: 0.8rem; color: rgba(255,255,255,0.5); font-weight: 600; transition: color 0.4s var(--ease); }
        .fp-step.active .fp-step-dot { background: var(--lime); border-color: var(--lime); color: var(--green-dark); box-shadow: 0 0 0 5px rgba(169,227,75,0.18); }
        .fp-step.active .fp-step-label { color: #fff; }
        .fp-step.done .fp-step-dot { background: var(--green); border-color: var(--green); color: #fff; }
        .fp-step-line { width: 46px; height: 2px; background: rgba(255,255,255,0.2); border-radius: 2px; position: relative; overflow: hidden; }
        .fp-step-line::after { content:''; position:absolute; inset:0; background:var(--lime); transform:scaleX(0); transform-origin:left; transition:transform 0.6s var(--ease); }
        .fp-step-line.fill::after { transform:scaleX(1); }

        .fp-card {
            background: var(--paper); border-radius: 22px; padding: 32px 30px 28px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
        }

        /* OTP 分段输入 */
        .otp { display: flex; align-items: center; justify-content: center; gap: 9px; }
        .otp-gap { width: 14px; }
        .otp-box {
            width: 48px; height: 56px; text-align: center;
            font-family: var(--font-mono); font-size: 1.25rem; font-weight: 700; color: var(--ink);
            background: #f7faf7; border: 1.5px solid var(--line); border-radius: 12px;
            transition: all 0.25s var(--ease); caret-color: var(--green);
        }
        .otp-box:focus { outline: none; border-color: var(--green); background: #fff; box-shadow: 0 0 0 4px rgba(47,158,68,0.13); transform: translateY(-2px); }
        .otp-box.filled { border-color: rgba(47,158,68,0.45); background: rgba(47,158,68,0.06); }
        .otp.shake .otp-box { animation: shake 0.45s var(--ease); border-color: var(--danger); }

        /* 密码强度计 */
        .strength { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
        .strength-track { flex: 1; height: 5px; background: #e7efe6; border-radius: 3px; overflow: hidden; }
        .strength-fill { height: 100%; width: 0; border-radius: 3px; background: var(--danger); transition: width 0.4s var(--ease), background 0.4s var(--ease); }
        .strength-label { font-size: 0.72rem; font-weight: 700; color: var(--ink-faint); min-width: 52px; text-align: right; transition: color 0.3s var(--ease); }

        /* 成功状态 */
        .fp-success { display: none; text-align: center; padding: 20px 0; }
        .fp-success.show { display: block; animation: fpUp 0.5s var(--ease-out) both; }
        .fp-check { width: 92px; height: 92px; margin: 0 auto 24px; }
        .fp-check svg { width: 100%; height: 100%; }
        .fp-check circle { stroke: var(--lime); stroke-width: 2.5; stroke-dasharray: 160; stroke-dashoffset: 160; animation: drawCircle 0.7s var(--ease) forwards; }
        .fp-check path { stroke: var(--lime); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: drawCheck 0.45s var(--ease) 0.6s forwards; }
        @keyframes drawCircle { to { stroke-dashoffset: 0; } }
        @keyframes drawCheck { to { stroke-dashoffset: 0; } }
        .fp-success h3 { font-family: var(--font-display); font-weight: 900; font-size: 1.5rem; color: #fff; margin-bottom: 8px; }
        .fp-success p { color: rgba(255,255,255,0.62); font-size: 0.9rem; }

        /* ============ 响应式 ============ */
        @media (max-width: 1024px) {
            .scene { grid-template-columns: 1fr; }
            .brand-panel { display: none; }
            body { overflow: auto; }
            .form-panel { min-height: 100vh; }
            .back-link { color: var(--green-deep); border-color: rgba(47,158,68,0.3); background: rgba(255,255,255,0.7); }
        }
        @media (max-width: 480px) {
            .form-panel { padding: 24px 18px; }
            .form-card { padding: 28px 22px 24px; }
            .code-flex { flex-direction: column; }
            .code-send { height: 46px; }
            .otp { gap: 6px; }
            .otp-gap { width: 8px; }
            .otp-box { width: 40px; height: 50px; font-size: 1.05rem; }
            .fp-card { padding: 26px 20px 22px; }
            .fp-step-label { display: none; }
        }
    </style>
</head>
<body>
    <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> 返回首页</a>

    <div class="scene">
        <!-- ============ 左侧品牌面板 ============ -->
        <aside class="brand-panel">
            <div class="brand-grid"></div>
            <div class="orb orb-a"></div>
            <div class="orb orb-b"></div>
            <div class="particles" id="particles"></div>

            <div class="brand-content">
                <div class="brand-logo">
                    <img src="/favicon.jpg" alt="绿豆蛙">
                    <span>绿豆蛙<em>日报助手</em></span>
                </div>

                <div class="brand-eyebrow"><span class="dot"></span> AI 视觉 · 自动工作记录</div>

                <h1 class="brand-headline">让 AI 替你<br><span class="hl">记住</span>这一天</h1>
                <p class="brand-sub">
                    登录后即可跨设备同步工作轨迹，随时回看你的时间都去哪儿了，
                    日报周报一键生成。
                </p>

                <div class="live-sim">
                    <div class="live-sim-head">
                        <span class="rec"></span>
                        <span>绿豆蛙正在工作</span>
                        <span class="scan-line" id="scanLine">SCANNING…</span>
                    </div>
                    <div class="sim-feed" id="simFeed"></div>
                </div>

                <div class="brand-stats">
                    <div class="bs"><strong>14</strong><span>种工作类型</span></div>
                    <div class="bs"><strong>24h</strong><span>全天候记录</span></div>
                    <div class="bs"><strong>100%</strong><span>数据本地留存</span></div>
                </div>
            </div>
        </aside>

        <!-- ============ 右侧表单面板 ============ -->
        <main class="form-panel">
            <div class="form-glow form-glow-a"></div>
            <div class="form-glow form-glow-b"></div>

            <div class="form-wrap">
                <div class="form-heading">
                    <h2 id="formTitle">欢迎回来 👋</h2>
                    <p id="formSub">登录账号，继续你的工作记录之旅</p>
                </div>

                <div class="seg" id="seg">
                    <div class="seg-pill"></div>
                    <div class="seg-btn active" id="segLogin" onclick="switchMode(false)">登 录</div>
                    <div class="seg-btn" id="segSignup" onclick="switchMode(true)">注 册</div>
                </div>

                <div class="forms-viewport">
                    <div class="forms-track" id="formsTrack">
                        <!-- ===== 登录表单 ===== -->
                        <div class="form-pane">
                            <div class="form-card">
                                <div class="field">
                                    <label class="field-label" for="loginEmail">邮箱</label>
                                    <div class="field-box">
                                        <i class="fas fa-envelope lead"></i>
                                        <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
                                    </div>
                                </div>
                                <div class="field">
                                    <label class="field-label" for="loginPassword">密码</label>
                                    <div class="field-box">
                                        <i class="fas fa-lock lead"></i>
                                        <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password">
                                        <i class="fas fa-eye eye-btn" onclick="togglePwd(this, 'loginPassword')"></i>
                                    </div>
                                </div>
                                <div class="forgot-row">
                                    <a href="javascript:void(0)" class="forgot-link" onclick="openForgot()">
                                        <i class="fas fa-question-circle"></i> 忘记密码？
                                    </a>
                                </div>
                                <button type="button" class="submit-btn" id="loginBtn" onclick="handleLogin()">
                                    <span class="spinner"></span><span class="btn-text">登 录</span>
                                </button>
                                <div id="loginError" class="msg"></div>
                            </div>
                        </div>

                        <!-- ===== 注册表单 ===== -->
                        <div class="form-pane">
                            <div class="form-card">
                                <div class="field">
                                    <label class="field-label" for="regEmail">邮箱</label>
                                    <div class="field-box">
                                        <i class="fas fa-envelope lead"></i>
                                        <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email">
                                    </div>
                                </div>
                                <div class="field">
                                    <label class="field-label" for="regCode">验证码</label>
                                    <div class="code-flex">
                                        <div class="field-box">
                                            <i class="fas fa-shield-alt lead"></i>
                                            <input type="text" id="regCode" placeholder="6 位验证码" maxlength="6">
                                        </div>
                                        <button type="button" class="code-send" id="sendCodeBtn" onclick="sendCode()">发送验证码</button>
                                    </div>
                                </div>
                                <div class="field">
                                    <label class="field-label" for="regPassword">密码</label>
                                    <div class="field-box">
                                        <i class="fas fa-lock lead"></i>
                                        <input type="password" id="regPassword" placeholder="至少 6 位密码" autocomplete="new-password">
                                        <i class="fas fa-eye eye-btn" onclick="togglePwd(this, 'regPassword')"></i>
                                    </div>
                                </div>
                                <button type="button" class="submit-btn" id="regBtn" onclick="handleRegister()">
                                    <span class="spinner"></span><span class="btn-text">创建账号</span>
                                </button>
                                <div id="regError" class="msg"></div>
                                <div id="regSuccess" class="msg"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-foot">
                    继续即表示你同意 <a href="javascript:void(0)">服务条款</a> 与 <a href="javascript:void(0)">隐私政策</a>
                </div>
            </div>
        </main>
    </div>

    <!-- ============ 找回密码全屏界面 ============ -->
    <div class="fp-overlay" id="fpOverlay" aria-hidden="true">
        <div class="fp-bg">
            <div class="fp-grid"></div>
            <div class="orb fp-orb-a"></div>
            <div class="orb fp-orb-b"></div>
            <div class="particles" id="fpParticles"></div>
        </div>

        <button type="button" class="fp-back" onclick="closeForgot()">
            <i class="fas fa-arrow-left"></i> 返回登录
        </button>

        <div class="fp-wrap">
            <!-- 成功状态 -->
            <div class="fp-success" id="fpSuccess">
                <div class="fp-check">
                    <svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24" fill="none"/><path fill="none" d="M14 27l8 8 16-16"/></svg>
                </div>
                <h3>密码重置成功</h3>
                <p>正在带你回到登录页…</p>
            </div>

            <!-- 表单状态 -->
            <div class="fp-main" id="fpMain">
                <div class="fp-icon">
                    <i class="fas fa-key"></i>
                    <span class="fp-icon-ring"></span>
                </div>
                <h2 class="fp-title">找回密码</h2>
                <p class="fp-sub">别担心，跟着绿豆蛙三步找回你的账号</p>

                <!-- 步骤指示器 -->
                <div class="fp-steps">
                    <div class="fp-step active" id="fpStep1">
                        <span class="fp-step-dot">1</span><span class="fp-step-label">验证邮箱</span>
                    </div>
                    <div class="fp-step-line" id="fpStepLine"></div>
                    <div class="fp-step" id="fpStep2">
                        <span class="fp-step-dot">2</span><span class="fp-step-label">重置密码</span>
                    </div>
                </div>

                <div class="fp-card">
                    <!-- 邮箱 + 发送验证码 -->
                    <div class="field">
                        <label class="field-label" for="fpEmail">注册邮箱</label>
                        <div class="code-flex">
                            <div class="field-box">
                                <i class="fas fa-envelope lead"></i>
                                <input type="email" id="fpEmail" placeholder="you@example.com" autocomplete="email">
                            </div>
                            <button type="button" class="code-send" id="fpSendBtn" onclick="fpSendCode()">发送验证码</button>
                        </div>
                    </div>

                    <!-- 6 位验证码分段输入 -->
                    <div class="field">
                        <label class="field-label">邮箱验证码</label>
                        <div class="otp" id="fpOtp">
                            <input type="text" inputmode="numeric" maxlength="1" class="otp-box" data-idx="0">
                            <input type="text" inputmode="numeric" maxlength="1" class="otp-box" data-idx="1">
                            <input type="text" inputmode="numeric" maxlength="1" class="otp-box" data-idx="2">
                            <span class="otp-gap"></span>
                            <input type="text" inputmode="numeric" maxlength="1" class="otp-box" data-idx="3">
                            <input type="text" inputmode="numeric" maxlength="1" class="otp-box" data-idx="4">
                            <input type="text" inputmode="numeric" maxlength="1" class="otp-box" data-idx="5">
                        </div>
                    </div>

                    <!-- 新密码 + 强度计 -->
                    <div class="field">
                        <label class="field-label" for="fpPassword">新密码</label>
                        <div class="field-box">
                            <i class="fas fa-lock lead"></i>
                            <input type="password" id="fpPassword" placeholder="至少 6 位密码" autocomplete="new-password">
                            <i class="fas fa-eye eye-btn" onclick="togglePwd(this, 'fpPassword')"></i>
                        </div>
                        <div class="strength" id="fpStrength">
                            <div class="strength-track"><div class="strength-fill" id="fpStrengthFill"></div></div>
                            <span class="strength-label" id="fpStrengthLabel">密码强度</span>
                        </div>
                    </div>

                    <button type="button" class="submit-btn" id="fpBtn" onclick="handleReset()">
                        <span class="spinner"></span><span class="btn-text">重置密码</span>
                    </button>
                    <div id="fpError" class="msg"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* ============ 模式切换（登录 / 注册）============ */
        function switchMode(isSignup) {
            document.getElementById('seg').classList.toggle('signup', isSignup);
            document.getElementById('formsTrack').classList.toggle('show-signup', isSignup);
            document.getElementById('segLogin').classList.toggle('active', !isSignup);
            document.getElementById('segSignup').classList.toggle('active', isSignup);

            const title = document.getElementById('formTitle');
            const sub = document.getElementById('formSub');
            if (isSignup) {
                title.textContent = '创建账号 🌱';
                sub.textContent = '几步即可开始，让绿豆蛙为你记录工作';
            } else {
                title.textContent = '欢迎回来 👋';
                sub.textContent = '登录账号，继续你的工作记录之旅';
            }
            clearMsgs();
        }

        function clearMsgs() {
            setMsg('loginError', '', 'error');
            setMsg('regError', '', 'error');
            setMsg('regSuccess', '', 'success');
        }

        function setMsg(id, text, type) {
            const el = document.getElementById(id);
            el.textContent = text;
            el.className = 'msg' + (text ? ' ' + type : '');
        }

        function shakeField(inputId) {
            const box = document.getElementById(inputId).closest('.field-box');
            if (!box) return;
            box.classList.remove('shake');
            void box.offsetWidth;
            box.classList.add('shake');
        }

        /* URL hash：#register 直达注册 */
        if (window.location.hash === '#register') switchMode(true);

        /* ============ 密码可见切换 ============ */
        function togglePwd(icon, inputId) {
            const input = document.getElementById(inputId);
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            icon.classList.toggle('fa-eye', !show);
            icon.classList.toggle('fa-eye-slash', show);
        }

        /* ============ 按钮加载态 ============ */
        function setLoading(btnId, loading, text) {
            const btn = document.getElementById(btnId);
            btn.classList.toggle('loading', loading);
            btn.disabled = loading;
            if (text) btn.querySelector('.btn-text').textContent = text;
        }

        /* ============ 发送验证码 ============ */
        async function sendCode() {
            const email = document.getElementById('regEmail').value.trim();
            if (!email) {
                setMsg('regError', '请输入邮箱地址', 'error');
                shakeField('regEmail');
                return;
            }

            const btn = document.getElementById('sendCodeBtn');
            btn.disabled = true;
            btn.textContent = '发送中…';

            try {
                const response = await fetch('/api/send-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await response.json();

                if (data.success) {
                    setMsg('regError', '', 'error');
                    setMsg('regSuccess', '✓ 验证码已发送到邮箱', 'success');
                    let countdown = 60;
                    const timer = setInterval(() => {
                        countdown--;
                        btn.textContent = `${countdown}s 后重发`;
                        if (countdown <= 0) {
                            clearInterval(timer);
                            btn.textContent = '发送验证码';
                            btn.disabled = false;
                        }
                    }, 1000);
                } else {
                    setMsg('regError', data.message, 'error');
                    btn.textContent = '发送验证码';
                    btn.disabled = false;
                }
            } catch (error) {
                setMsg('regError', '发送失败，请稍后重试', 'error');
                btn.textContent = '发送验证码';
                btn.disabled = false;
            }
        }

        /* ============ 登录 ============ */
        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (!email || !password) {
                setMsg('loginError', '请填写邮箱和密码', 'error');
                if (!email) shakeField('loginEmail'); else shakeField('loginPassword');
                return;
            }

            setLoading('loginBtn', true, '登录中…');
            setMsg('loginError', '', 'error');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (data.success) {
                    setLoading('loginBtn', false, '登 录');
                    window.location.href = '/user/' + encodeURIComponent(email);
                } else {
                    setLoading('loginBtn', false, '登 录');
                    setMsg('loginError', data.message, 'error');
                    shakeField('loginPassword');
                }
            } catch (error) {
                setLoading('loginBtn', false, '登 录');
                setMsg('loginError', '登录失败，请稍后重试', 'error');
            }
        }

        /* ============ 注册 ============ */
        async function handleRegister() {
            const email = document.getElementById('regEmail').value.trim();
            const code = document.getElementById('regCode').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            if (!email || !code || !password) {
                setMsg('regError', '请填写完整信息', 'error');
                setMsg('regSuccess', '', 'success');
                if (!email) shakeField('regEmail');
                else if (!code) shakeField('regCode');
                else shakeField('regPassword');
                return;
            }
            if (password.length < 6) {
                setMsg('regError', '密码至少需要 6 位', 'error');
                setMsg('regSuccess', '', 'success');
                shakeField('regPassword');
                return;
            }

            setLoading('regBtn', true, '注册中…');
            setMsg('regError', '', 'error');
            setMsg('regSuccess', '', 'success');

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code, password })
                });
                const data = await response.json();

                if (data.success) {
                    setLoading('regBtn', false, '创建账号');
                    setMsg('regSuccess', '✓ 注册成功！正在进入你的工作台…', 'success');
                    setTimeout(() => {
                        window.location.href = '/user/' + encodeURIComponent(email);
                    }, 1400);
                } else {
                    setLoading('regBtn', false, '创建账号');
                    setMsg('regError', data.message, 'error');
                }
            } catch (error) {
                setLoading('regBtn', false, '创建账号');
                setMsg('regError', '注册失败，请稍后重试', 'error');
            }
        }

        /* ============ 回车提交 ============ */
        document.getElementById('loginPassword').addEventListener('keypress', e => { if (e.key === 'Enter') handleLogin(); });
        document.getElementById('loginEmail').addEventListener('keypress', e => { if (e.key === 'Enter') handleLogin(); });
        document.getElementById('regPassword').addEventListener('keypress', e => { if (e.key === 'Enter') handleRegister(); });
        document.getElementById('regCode').addEventListener('keypress', e => { if (e.key === 'Enter') handleRegister(); });

        /* ============ 左侧粒子 ============ */
        (function initParticles() {
            const wrap = document.getElementById('particles');
            if (!wrap) return;
            for (let i = 0; i < 16; i++) {
                const p = document.createElement('i');
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (8 + Math.random() * 10) + 's';
                p.style.animationDelay = (-Math.random() * 12) + 's';
                p.style.width = p.style.height = (3 + Math.random() * 4) + 'px';
                p.style.opacity = 0.25 + Math.random() * 0.4;
                wrap.appendChild(p);
            }
        })();

        /* ============ 左侧实时识别模拟 ============ */
        const SIM = [
            { icon: 'fa-code',           c: '#2f9e44', t: '开发',     d: '编辑核心模块，调试接口逻辑' },
            { icon: 'fa-comments',       c: '#1c7ed6', t: '沟通',     d: '团队群聊，同步项目进度' },
            { icon: 'fa-file-alt',       c: '#f08c00', t: '文档',     d: '撰写需求文档，整理要点' },
            { icon: 'fa-chart-line',     c: '#e64980', t: '数据分析', d: '查看运营看板，分析趋势' },
            { icon: 'fa-pen-ruler',      c: '#9c36b5', t: '设计',     d: '调整界面原型与交互' },
            { icon: 'fa-users',          c: '#0ca678', t: '会议',     d: '产品评审，记录待办' },
            { icon: 'fa-graduation-cap', c: '#5c940d', t: '学习',     d: '阅读技术文章充电' }
        ];
        (function initSim() {
            const feed = document.getElementById('simFeed');
            if (!feed) return;
            for (let i = 0; i < 2; i++) pushSim(feed, false);
            setInterval(() => pushSim(feed, true), 2400);

            const scan = document.getElementById('scanLine');
            let dots = 0;
            setInterval(() => { dots = (dots + 1) % 4; scan.textContent = 'SCANNING' + '.'.repeat(dots); }, 420);
        })();

        function pushSim(feed, animate) {
            const a = SIM[Math.floor(Math.random() * SIM.length)];
            const mins = Math.floor(Math.random() * 40 + 5);
            const now = new Date();
            const time = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
            const card = document.createElement('div');
            card.className = 'sim-card';
            card.style.setProperty('--sc', a.c);
            if (!animate) card.style.animation = 'none';
            card.innerHTML =
                '<div class="sc-icon" style="background:' + a.c + '"><i class="fas ' + a.icon + '"></i></div>' +
                '<div class="sc-body"><div class="sc-title">' + a.t + '</div><div class="sc-desc">' + a.d + '</div></div>' +
                '<div class="sc-time">' + time + ' · ' + mins + 'min</div>';
            feed.insertBefore(card, feed.firstChild);
            while (feed.children.length > 2) feed.removeChild(feed.lastChild);
        }

        /* ============ 找回密码 ============ */
        function openForgot() {
            const ov = document.getElementById('fpOverlay');
            ov.classList.add('open');
            ov.setAttribute('aria-hidden', 'false');
            initFpParticles();
            setTimeout(() => document.getElementById('fpEmail').focus(), 400);
        }

        function closeForgot() {
            const ov = document.getElementById('fpOverlay');
            ov.classList.remove('open');
            ov.setAttribute('aria-hidden', 'true');
            // 重置表单
            document.getElementById('fpEmail').value = '';
            document.getElementById('fpPassword').value = '';
            clearOtp();
            setMsg('fpError', '', 'error');
            resetStrength();
            setFpStep(1);
            document.getElementById('fpSuccess').classList.remove('show');
            document.getElementById('fpMain').style.display = '';
        }

        /* 步骤指示器 */
        function setFpStep(step) {
            const s1 = document.getElementById('fpStep1');
            const s2 = document.getElementById('fpStep2');
            const line = document.getElementById('fpStepLine');
            s1.classList.toggle('active', step === 1);
            s1.classList.toggle('done', step > 1);
            s2.classList.toggle('active', step === 2);
            line.classList.toggle('fill', step > 1);
            if (step > 1) s1.querySelector('.fp-step-dot').innerHTML = '<i class="fas fa-check" style="font-size:.7rem"></i>';
            else s1.querySelector('.fp-step-dot').textContent = '1';
        }

        /* 发送验证码 */
        async function fpSendCode() {
            const email = document.getElementById('fpEmail').value.trim();
            if (!email) {
                setMsg('fpError', '请输入注册邮箱', 'error');
                shakeField('fpEmail');
                return;
            }
            const btn = document.getElementById('fpSendBtn');
            btn.disabled = true;
            btn.textContent = '发送中…';
            try {
                const res = await fetch('/api/send-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                if (data.success) {
                    setMsg('fpError', '', 'error');
                    let cd = 60;
                    const timer = setInterval(() => {
                        cd--;
                        btn.textContent = cd + 's 后重发';
                        if (cd <= 0) { clearInterval(timer); btn.textContent = '发送验证码'; btn.disabled = false; }
                    }, 1000);
                    document.querySelector('#fpOtp .otp-box').focus();
                } else {
                    setMsg('fpError', data.message, 'error');
                    btn.textContent = '发送验证码';
                    btn.disabled = false;
                }
            } catch (e) {
                setMsg('fpError', '发送失败，请稍后重试', 'error');
                btn.textContent = '发送验证码';
                btn.disabled = false;
            }
        }

        /* OTP 分段输入 */
        const otpBoxes = Array.from(document.querySelectorAll('#fpOtp .otp-box'));
        otpBoxes.forEach((box, i) => {
            box.addEventListener('input', () => {
                box.value = box.value.replace(/\D/g, '').slice(-1);
                box.classList.toggle('filled', !!box.value);
                if (box.value && i < otpBoxes.length - 1) otpBoxes[i + 1].focus();
                updateFpStep();
            });
            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !box.value && i > 0) otpBoxes[i - 1].focus();
            });
            box.addEventListener('paste', (e) => {
                e.preventDefault();
                const text = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
                text.split('').forEach((ch, j) => {
                    if (otpBoxes[j]) { otpBoxes[j].value = ch; otpBoxes[j].classList.add('filled'); }
                });
                if (otpBoxes[Math.min(text.length, 5)]) otpBoxes[Math.min(text.length, 5)].focus();
                updateFpStep();
            });
        });

        function getOtpValue() { return otpBoxes.map(b => b.value).join(''); }
        function clearOtp() { otpBoxes.forEach(b => { b.value = ''; b.classList.remove('filled'); }); }
        function shakeOtp() {
            const otp = document.getElementById('fpOtp');
            otp.classList.remove('shake'); void otp.offsetWidth; otp.classList.add('shake');
        }

        /* 根据填写情况推进步骤 */
        function updateFpStep() {
            const emailOk = !!document.getElementById('fpEmail').value.trim();
            const codeOk = getOtpValue().length === 6;
            setFpStep(emailOk && codeOk ? 2 : 1);
        }
        document.getElementById('fpEmail').addEventListener('input', updateFpStep);

        /* 密码强度计 */
        const fpPwd = document.getElementById('fpPassword');
        fpPwd.addEventListener('input', () => {
            const v = fpPwd.value;
            const fill = document.getElementById('fpStrengthFill');
            const label = document.getElementById('fpStrengthLabel');
            if (!v) { resetStrength(); return; }
            let score = 0;
            if (v.length >= 6) score++;
            if (v.length >= 10) score++;
            if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
            if (/\d/.test(v)) score++;
            if (/[^A-Za-z0-9]/.test(v)) score++;
            const levels = [
                { w: '20%', c: '#e03131', t: '太弱' },
                { w: '40%', c: '#f08c00', t: '较弱' },
                { w: '60%', c: '#fab005', t: '一般' },
                { w: '80%', c: '#2f9e44', t: '较强' },
                { w: '100%', c: '#1f6f31', t: '极强' }
            ];
            const lv = levels[Math.min(score, 5) - 1] || levels[0];
            fill.style.width = lv.w;
            fill.style.background = lv.c;
            label.textContent = lv.t;
            label.style.color = lv.c;
        });
        function resetStrength() {
            document.getElementById('fpStrengthFill').style.width = '0';
            const label = document.getElementById('fpStrengthLabel');
            label.textContent = '密码强度';
            label.style.color = '';
        }

        /* 重置密码 */
        async function handleReset() {
            const email = document.getElementById('fpEmail').value.trim();
            const code = getOtpValue();
            const password = fpPwd.value;

            if (!email) { setMsg('fpError', '请输入注册邮箱', 'error'); shakeField('fpEmail'); return; }
            if (code.length !== 6) { setMsg('fpError', '请输入 6 位验证码', 'error'); shakeOtp(); return; }
            if (!password) { setMsg('fpError', '请输入新密码', 'error'); shakeField('fpPassword'); return; }
            if (password.length < 6) { setMsg('fpError', '密码至少需要 6 位', 'error'); shakeField('fpPassword'); return; }

            setLoading('fpBtn', true, '重置中…');
            setMsg('fpError', '', 'error');

            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code, new_password: password })
                });
                const data = await res.json();
                if (data.success) {
                    setLoading('fpBtn', false, '重置密码');
                    // 显示成功动画
                    document.getElementById('fpMain').style.display = 'none';
                    document.getElementById('fpSuccess').classList.add('show');
                    setTimeout(closeForgot, 2200);
                } else {
                    setLoading('fpBtn', false, '重置密码');
                    setMsg('fpError', data.message, 'error');
                    if (data.message && data.message.includes('验证码')) shakeOtp();
                    else shakeField('fpPassword');
                }
            } catch (e) {
                setLoading('fpBtn', false, '重置密码');
                setMsg('fpError', '重置失败，请稍后重试', 'error');
            }
        }

        /* 找回密码页粒子 */
        let fpParticlesDone = false;
        function initFpParticles() {
            if (fpParticlesDone) return;
            fpParticlesDone = true;
            const wrap = document.getElementById('fpParticles');
            if (!wrap) return;
            for (let i = 0; i < 14; i++) {
                const p = document.createElement('i');
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (8 + Math.random() * 10) + 's';
                p.style.animationDelay = (-Math.random() * 12) + 's';
                p.style.width = p.style.height = (3 + Math.random() * 4) + 'px';
                p.style.opacity = 0.25 + Math.random() * 0.4;
                wrap.appendChild(p);
            }
        }

        /* ESC 关闭找回密码 */
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('fpOverlay').classList.contains('open')) closeForgot();
        });
    </script>
</body>
</html>
